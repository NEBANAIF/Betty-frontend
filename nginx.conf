server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing - any path that isn't a real
    # static file falls back to index.html so a hard refresh on e.g.
    # /sales-history doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the backend container (service name "backend"
    # in docker-compose.yml). This is why the frontend build doesn't need
    # VITE_API_BASE_URL set at all in the default Compose setup - it just
    # uses the relative '/api' fallback already baked into api/client.js,
    # and nginx forwards it server-side, sidestepping CORS entirely for
    # the common single-host deployment.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }

    # Cache hashed build assets aggressively; never cache index.html
    # itself, or a deploy could get stuck serving a stale shell that
    # references assets which no longer exist.
    location ~* \.(js|css|svg|woff2?|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
